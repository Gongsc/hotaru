name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            # macOS 只产 dmg；fail_on_unmatched_files 下平台无关的清单会导致误报失败
            release_files: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            release_files: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            release_files: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build
        shell: bash
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotaru-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: ${{ matrix.release_files }}
