<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotaru 设置</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f5f8; --panel: #ffffff; --field: #f8fafc; --border: #d7dee8;
    --text: #172033; --muted: #5d6b7e; --accent: #059669; --accent2: #0284c7;
    --danger: #dc2626; --warn: #b45309; --button: #edf1f6; --button-hover: #e2e8f0;
    --toast-bg: #ecfdf5; --logo-ink: #0b1220;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1220; --panel: #111a2c; --field: #0d1626; --border: #2b3a56;
    --text: #e6edf7; --muted: #a7b6ca; --accent: #34d399; --accent2: #38bdf8;
    --danger: #f87171; --warn: #fbbf24; --button: #1a2740; --button-hover: #223154;
    --toast-bg: #052e22; --logo-ink: #0b1220;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="dark"]) {
      color-scheme: dark;
      --bg: #0b1220; --panel: #111a2c; --field: #0d1626; --border: #2b3a56;
      --text: #e6edf7; --muted: #a7b6ca; --accent: #34d399; --accent2: #38bdf8;
      --danger: #f87171; --warn: #fbbf24; --button: #1a2740; --button-hover: #223154;
      --toast-bg: #052e22; --logo-ink: #0b1220;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  }
  main { max-width: 600px; margin: 0 auto; padding: 20px 20px 96px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, #34d399, #38bdf8);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 18px; height: 18px; stroke: var(--logo-ink); }
  section {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  section h2 {
    font-size: 12px; margin: 0 0 12px; color: var(--muted);
    font-weight: 600; letter-spacing: .08em;
  }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
  input[type="text"], input[type="password"], input[type="number"], select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--field); color: var(--text); font-size: 14px; outline: none;
  }
  input:focus, select:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, .25);
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; cursor: pointer; user-select: none; }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
  .radio-row { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .radio-row .check { margin: 0; }
  .btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--button); color: var(--text); cursor: pointer; font-size: 13px;
  }
  .btn:hover { background: var(--button-hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); color: #06281c; border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent2); outline-offset: 2px;
  }
  #testResult { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; word-break: break-all; }
  #testResult.ok { color: var(--accent); }
  #testResult.err { color: var(--danger); }
  .about-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .about-product { display: flex; flex-direction: column; gap: 2px; }
  .about-product strong { font-size: 16px; font-weight: 600; }
  .about-version { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .about-copy { color: var(--muted); font-size: 12px; margin: 12px 0; }
  .about-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .github-btn { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .github-btn svg { width: 15px; height: 15px; fill: currentColor; }
  #updateStatus { min-height: 18px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  #updateStatus.ok { color: var(--accent); }
  #updateStatus.update { color: var(--warn); }
  #updateStatus.err { color: var(--danger); }
  [hidden] { display: none !important; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--accent); }
  .dot.off { background: var(--danger); }
  .dot.err { background: #64748b; }
  .status-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .status-msg { color: var(--danger); font-size: 12px; margin-top: 8px; word-break: break-all; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, var(--bg) 35%);
    padding: 16px 20px; display: flex; justify-content: flex-end; gap: 10px;
  }
  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--toast-bg); color: var(--accent); border: 1px solid var(--accent);
    padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .25s;
    pointer-events: none; font-size: 13px; z-index: 10;
  }
  #toast.show { opacity: 1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint a { color: var(--accent2); }
  .node-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #nodeStatus { font-size: 12px; color: var(--muted); }
  #nodeStatus.err { color: var(--danger); }
  .node-list { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; max-height: 264px; overflow-y: auto; }
  .node-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; user-select: none; }
  .node-row:hover { background: var(--field); }
  .node-row input { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
  .node-row .node-name { flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-tags { display: flex; gap: 4px; flex-wrap: wrap; min-width: 0; }
  .node-tag {
    font-size: 11px; padding: 1px 7px; border-radius: 99px; white-space: nowrap;
    background: var(--button); border: 1px solid var(--border); color: var(--muted);
  }
  .node-untagged { font-size: 11px; color: var(--muted); opacity: .65; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 3a9 9 0 1 0 9 9" />
        <path d="M12 8v4l3 2" />
      </svg>
    </div>
    <h1>Hotaru 设置</h1>
  </header>

  <section>
    <h2>外观</h2>
    <label class="field" style="margin-bottom:0;">
      <span>主题</span>
      <select id="theme" aria-label="应用主题">
        <option value="system">跟随系统</option>
        <option value="light">亮色</option>
        <option value="dark">暗色</option>
      </select>
    </label>
  </section>

  <section>
    <h2>连接</h2>
    <label class="field">
      <span>后端地址</span>
      <input type="text" id="backendUrl" placeholder="https://komari.example.com" spellcheck="false" autocomplete="off">
    </label>
    <label class="field">
      <span>API Key（私有站点或需要更全数据时填写）</span>
      <input type="password" id="apiKey" placeholder="可选" autocomplete="off">
    </label>
    <div style="display:flex; gap:10px; align-items:flex-start;">
      <button class="btn" id="testBtn" type="button">测试连接</button>
      <label class="check" style="margin-top:4px;">
        <input type="checkbox" id="acceptInvalid"> 允许自签名证书
      </label>
    </div>
    <div id="testResult" role="status"></div>
  </section>

  <section>
    <h2>托盘</h2>
    <label class="check" id="macTitleRow">
      <input type="checkbox" id="showTitle"> macOS 菜单栏显示实时速率文字
    </label>
    <div class="row" style="margin-top:12px;">
      <label class="field">
        <span>刷新间隔（秒）</span>
        <input type="number" id="pollInterval" min="1" max="60" step="1">
      </label>
      <label class="field">
        <span>CPU 告警阈值（%）</span>
        <input type="number" id="cpuWarn" min="1" max="100">
      </label>
      <label class="field">
        <span>内存告警阈值（%）</span>
        <input type="number" id="memWarn" min="1" max="100">
      </label>
    </div>
    <p class="hint">菜单栏图标使用系统单色样式：完整状态环 = 正常，右上圆点 = 超过告警阈值或部分节点离线，斜杠 = 全部离线或后端不可达。</p>
    <label class="check">
      <input type="checkbox" id="autostart"> 开机自启
    </label>
  </section>

  <section>
    <h2>图表</h2>
    <label class="field">
      <span>曲线显示区间（托盘左键弹窗）</span>
      <select id="chartRange">
        <option value="300">5 分钟</option>
        <option value="900">15 分钟</option>
        <option value="3600">1 小时</option>
        <option value="21600">6 小时</option>
      </select>
    </label>
    <p class="hint">汇总上下行速率的历史曲线。数据仅保存在内存中（固定保留 6 小时），重启应用后清空；曲线时间粒度与刷新间隔一致。</p>
  </section>

  <section>
    <h2>节点</h2>
    <div class="node-head">
      <button class="btn" id="loadNodesBtn" type="button">获取节点列表</button>
      <button class="btn" id="selectAllNodesBtn" type="button">全选</button>
      <button class="btn" id="clearAllNodesBtn" type="button">全部取消</button>
      <span id="nodeStatus" role="status" aria-live="polite"></span>
    </div>
    <div class="node-list" id="nodeList"></div>
    <p class="hint">勾选的节点才会出现在托盘左键弹窗的节点列表里。取消勾选只隐藏列表项：托盘图标、悬浮提示与汇总曲线依旧统计全部节点。标签取自 Komari 的节点设置。</p>
  </section>

  <section id="about">
    <h2>关于</h2>
    <div class="about-head">
      <div class="about-product">
        <strong>Hotaru</strong>
        <span class="about-version">版本 <span id="appVersion">…</span></span>
      </div>
      <button class="btn github-btn" id="githubBtn" type="button" aria-label="在浏览器中打开 Hotaru GitHub 仓库">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.5 11.5 0 0 0 8.36 23.1c.58.1.79-.25.79-.56v-2.23c-3.23.7-3.91-1.37-3.91-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.58-.3-5.29-1.29-5.29-5.73 0-1.27.45-2.3 1.2-3.12-.12-.3-.52-1.48.11-3.08 0 0 .98-.31 3.16 1.19a10.9 10.9 0 0 1 5.76 0c2.19-1.5 3.16-1.19 3.16-1.19.63 1.6.23 2.78.11 3.08.75.82 1.2 1.85 1.2 3.12 0 4.46-2.72 5.43-5.3 5.72.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        GitHub
      </button>
    </div>
    <p class="about-copy">Komari 的 macOS 与 Windows 托盘监控应用。</p>
    <div class="about-actions">
      <button class="btn" id="checkUpdateBtn" type="button">检查更新</button>
      <button class="btn primary" id="viewReleaseBtn" type="button" hidden>查看新版本</button>
    </div>
    <div id="updateStatus" role="status" aria-live="polite" aria-atomic="true"></div>
  </section>
</main>

<footer>
  <button class="btn" id="openPanelBtn" type="button">打开面板</button>
  <button class="btn primary" id="saveBtn" type="button">保存</button>
</footer>

<div id="toast" role="status"></div>

<script>
const { invoke } = window.__TAURI__.core;

const $ = (id) => document.getElementById(id);
const isMac = /Mac/i.test(navigator.userAgent);
let currentSettings = {};
// Node uuids kept out of the popover list, plus the rows to pick from. The
// hidden set is what gets persisted, so a node added later stays visible.
let hiddenNodes = new Set();
let nodeOptions = [];

function applyTheme(theme) {
  const value = ['system', 'light', 'dark'].includes(theme) ? theme : 'system';
  if (value === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = value;
}

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function collect() {
  return {
    ...currentSettings,
    backend_url: $('backendUrl').value.trim(),
    api_key: $('apiKey').value.trim(),
    poll_interval_secs: Math.max(1, Math.min(60, Number($('pollInterval').value) || 3)),
    show_menu_bar_text: $('showTitle').checked,
    cpu_warn_pct: Math.max(1, Math.min(100, Number($('cpuWarn').value) || 80)),
    mem_warn_pct: Math.max(1, Math.min(100, Number($('memWarn').value) || 85)),
    accept_invalid_certs: $('acceptInvalid').checked,
    chart_range_secs: Number($('chartRange').value) || 900,
    theme: $('theme').value,
    hidden_nodes: [...hiddenNodes],
  };
}

function fillSettings(s) {
  currentSettings = { ...s };
  $('backendUrl').value = s.backend_url || '';
  $('apiKey').value = s.api_key || '';
  $('pollInterval').value = s.poll_interval_secs ?? 3;
  $('cpuWarn').value = s.cpu_warn_pct ?? 80;
  $('memWarn').value = s.mem_warn_pct ?? 85;
  $('showTitle').checked = !!s.show_menu_bar_text;
  $('acceptInvalid').checked = !!s.accept_invalid_certs;
  $('chartRange').value = String(s.chart_range_secs ?? 900);
  if ($('chartRange').selectedIndex === -1) $('chartRange').value = '900';
  $('theme').value = s.theme || 'system';
  if ($('theme').selectedIndex === -1) $('theme').value = 'system';
  hiddenNodes = new Set(s.hidden_nodes || []);
  renderNodeList();
  applyTheme($('theme').value);
}

// Names and tags are backend-controlled, so every cell goes in as text.
function renderNodeList() {
  const list = $('nodeList');
  list.innerHTML = '';
  // 全选即“显示全部”,哪怕当前一行都没拉出来也可以清掉隐藏集
  $('selectAllNodesBtn').disabled = !nodeOptions.length && !hiddenNodes.size;
  $('clearAllNodesBtn').disabled = !nodeOptions.length;
  if (!nodeOptions.length) {
    const empty = document.createElement('p');
    empty.className = 'hint';
    empty.style.margin = '0';
    empty.textContent = '尚未获取节点列表。';
    list.appendChild(empty);
    return;
  }
  for (const node of nodeOptions) {
    const row = document.createElement('label');
    row.className = 'node-row';

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = !hiddenNodes.has(node.uuid);
    box.addEventListener('change', () => {
      if (box.checked) hiddenNodes.delete(node.uuid);
      else hiddenNodes.add(node.uuid);
    });

    const name = document.createElement('span');
    name.className = 'node-name';
    name.textContent = node.name || node.uuid;

    const tags = document.createElement('span');
    tags.className = 'node-tags';
    if (node.tags && node.tags.length) {
      for (const tag of node.tags) {
        const chip = document.createElement('span');
        chip.className = 'node-tag';
        chip.textContent = tag;
        tags.appendChild(chip);
      }
    } else {
      const none = document.createElement('span');
      none.className = 'node-untagged';
      none.textContent = '无标签';
      tags.appendChild(none);
    }

    row.append(box, name, tags);
    list.appendChild(row);
  }
}

// Seed the picker from the running monitor's snapshot — local IPC, no backend
// request — so reopening settings shows what is currently hidden without
// having to fetch first.
async function seedNodeList() {
  try {
    const snap = await invoke('get_snapshot');
    if (!snap || !snap.nodes || !snap.nodes.length) return;
    nodeOptions = snap.nodes.map((n) => ({ uuid: n.uuid, name: n.name, tags: n.tags || [] }));
    renderNodeList();
  } catch (_) { /* leave the list empty until fetched */ }
}



async function refreshAutostart() {
  try { $('autostart').checked = await invoke('get_autostart'); } catch (_) {}
}

async function loadAppInfo() {
  try {
    const info = await invoke('get_app_info');
    $('appVersion').textContent = info.version;
  } catch (e) {
    $('appVersion').textContent = '未知';
  }
}

async function boot() {
  if (!isMac) $('macTitleRow').style.display = 'none';
  try {
    fillSettings(await invoke('get_settings'));
  } catch (e) {
    console.error(e);
  }
  await Promise.all([refreshAutostart(), loadAppInfo(), seedNodeList()]);
}

$('saveBtn').addEventListener('click', async () => {
  const btn = $('saveBtn');
  btn.disabled = true;
  const before = currentSettings;
  try {
    const saved = await invoke('save_settings', { settings: collect() });
    const targetChanged = saved.backend_url !== before.backend_url
      || saved.api_key !== before.api_key
      || saved.accept_invalid_certs !== before.accept_invalid_certs;
    fillSettings(saved);
    toast('已保存');
    // 换了后端(或凭据)就是换了数据源,列表里那批节点已经不作数了
    if (targetChanged && saved.backend_url) loadNodes();
  } catch (e) {
    toast('保存失败：' + e);
  } finally {
    btn.disabled = false;
  }
});

$('testBtn').addEventListener('click', async () => {
  const btn = $('testBtn');
  const out = $('testResult');
  btn.disabled = true;
  out.className = '';
  out.textContent = '正在连接…';
  try {
    const r = await invoke('test_connection', { settings: collect() });
    out.className = 'ok';
    out.textContent = `${r.message}${r.version ? ' · 版本 ' + r.version : ''}`;
  } catch (e) {
    out.className = 'err';
    out.textContent = String(e);
  } finally {
    btn.disabled = false;
  }
});

async function loadNodes() {
  const btn = $('loadNodesBtn');
  const out = $('nodeStatus');
  btn.disabled = true;
  out.className = '';
  out.textContent = '正在获取…';
  try {
    // Uses the form's current values, so nodes can be picked before saving.
    nodeOptions = await invoke('list_nodes', { settings: collect() });
    renderNodeList();
    out.textContent = `共 ${nodeOptions.length} 个节点`;
    // 让托盘弹窗也立刻拿到同一份列表:引擎平时每分钟才重读一次 /api/nodes
    await invoke('resync_nodes').catch(() => {});
  } catch (e) {
    out.className = 'err';
    out.textContent = String(e);
  } finally {
    btn.disabled = false;
  }
}

$('loadNodesBtn').addEventListener('click', loadNodes);

$('selectAllNodesBtn').addEventListener('click', () => {
  // 清掉整个隐藏集,包括列表里已经看不到的旧 uuid —— 否则那些节点会一直隐身
  hiddenNodes.clear();
  renderNodeList();
});

$('clearAllNodesBtn').addEventListener('click', () => {
  for (const node of nodeOptions) hiddenNodes.add(node.uuid);
  renderNodeList();
});

$('autostart').addEventListener('change', async (e) => {
  try {
    await invoke('set_autostart', { enable: e.target.checked });
  } catch (err) {
    e.target.checked = !e.target.checked;
    toast('设置开机自启失败：' + err);
  }
});

$('theme').addEventListener('change', (e) => applyTheme(e.target.value));

async function openGithub(page) {
  try {
    await invoke('open_github_page', { page });
  } catch (e) {
    toast('无法打开 GitHub：' + e);
  }
}

$('githubBtn').addEventListener('click', () => openGithub('repository'));
$('viewReleaseBtn').addEventListener('click', () => openGithub('releases'));

$('checkUpdateBtn').addEventListener('click', async () => {
  const btn = $('checkUpdateBtn');
  const out = $('updateStatus');
  const releaseBtn = $('viewReleaseBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '检查中…';
  out.className = '';
  out.textContent = '正在连接 GitHub…';
  out.setAttribute('aria-busy', 'true');
  releaseBtn.hidden = true;
  try {
    const result = await invoke('check_for_updates');
    $('appVersion').textContent = result.current_version;
    if (result.update_available) {
      out.className = 'update';
      out.textContent = `发现新版本 v${result.latest_version}，当前为 v${result.current_version}`;
      releaseBtn.textContent = `查看 v${result.latest_version}`;
      releaseBtn.hidden = false;
    } else if (result.current_version === result.latest_version) {
      out.className = 'ok';
      out.textContent = `已是最新版本 v${result.current_version}`;
    } else {
      out.className = 'ok';
      out.textContent = `当前版本 v${result.current_version} 高于 GitHub 最新版本 v${result.latest_version}`;
    }
  } catch (e) {
    out.className = 'err';
    out.textContent = '检查更新失败：' + String(e);
  } finally {
    out.removeAttribute('aria-busy');
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

$('openPanelBtn').addEventListener('click', () => invoke('open_panel_cmd'));

boot();
</script>
</body>
</html>
